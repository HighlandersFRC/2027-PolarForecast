services:
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: polar-forecast-api

    ports:
      - "8081:8080"

    env_file:
      - .env

    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://host.docker.internal:27017/}

    depends_on:
      - keycloak

    volumes:
      - ./API:/app/API

  keycloak:
    build:
      context: ./keycloak
    container_name: polar-forecast-keycloak

    ports:
      - "8000:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8000
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

    command:
      - start-dev
      - --import-realm

    volumes:
      - keycloak_h2:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes

volumes:
  keycloak_h2:

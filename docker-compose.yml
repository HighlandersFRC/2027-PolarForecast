services:
  keycloak:
    build:
      context: ./keycloak
    container_name: polar-forecast-keycloak

    ports:
      - "8000:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8000
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

    command:
      - start-dev
      - --import-realm

    volumes:
      - keycloak_h2:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes   # 👈 ADD THIS

volumes:
  keycloak_h2:
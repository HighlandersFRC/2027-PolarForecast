services:
  app:
    build:
      context: ./APP
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${APP_API_BASE_URL:-http://localhost:8081}
        KEYCLOAK_ISSUER: ${APP_KEYCLOAK_ISSUER:-http://localhost:8000/realms/polarforecast-web}
        REDIRECT_URI: ${APP_REDIRECT_URI:-http://localhost:3000/}
        POST_LOGOUT_REDIRECT_URI: ${APP_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
    container_name: polar-forecast-app

    ports:
      - "${APP_PORT:-3000}:80"

    depends_on:
      - api
      - keycloak

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: polar-forecast-api

    ports:
      - "8081:8080"

    env_file:
      - .env

    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      MONGO_URI: mongodb://mongodb:27017/

    depends_on:
      keycloak:
        condition: service_started
      mongodb:
        condition: service_healthy

    volumes:
      - ./API:/app/API

  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: polar-forecast-mongodb

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - mongodb_data:/data/db

  keycloak:
    build:
      context: ./keycloak
    container_name: polar-forecast-keycloak

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    ports:
      - "8000:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8000
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

    command:
      - start-dev
      - --import-realm

    volumes:
      - ./keycloak-themes:/opt/keycloak/themes

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: polar-forecast-keycloak-postgres

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

volumes:
  keycloak_postgres_data:
  mongodb_data:
